[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zeropawn"
version = "0.1.0"
description = "AlphaZero-style chess reinforcement learning platform (MCTS + dual-head ResNet)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "ZeroPawn Maintainers" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "python-chess>=1.999",
    "rich>=13.0.0",
    "scipy>=1.10.0",
    "zstandard>=0.20.0",
    "psutil>=5.9.0",
    "tensorboard>=2.14.0",
]

[project.urls]
Homepage = "https://github.com/MdHussain121/zeropawn"
Repository = "https://github.com/MdHussain121/zeropawn.git"
Issues = "https://github.com/MdHussain121/zeropawn/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.15.10",
]

[project.scripts]
zeropawn = "python.cli.main:main"
chess = "python.cli.main:main"
chess-rl = "python.cli.main:main"

# The wheel ships the *library* only.
[tool.setuptools.packages.find]
where = ["."]
include = ["python*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E741", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["python"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "F401", "F841", "F541", "E402"]
"scripts/*" = ["T201", "F401", "F841", "F541", "E402", "E701"]
"scratch/*" = ["F401", "F841", "F541", "E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
