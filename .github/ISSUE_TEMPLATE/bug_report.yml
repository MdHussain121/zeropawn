name: "Bug Report"
description: "File an issue describing a bug or unexpected behavior in ZeroPawn"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug. Please ensure you are testing against the latest commit.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Exact commands, arguments, or code to reproduce the issue.
      placeholder: |
        1. Run 'chess match run -n 10'
        2. Observe error...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS, Python version, C++ compiler, GPU/CUDA details, commit SHA.
      placeholder: |
        - OS: Windows 11 / Ubuntu 22.04 / macOS
        - Python: 3.12.10
        - PyTorch: 2.13.0
        - Hardware: RTX 4060 / CPU
        - Commit: 1b90786
    validations:
      required: true
