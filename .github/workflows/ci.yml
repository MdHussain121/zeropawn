name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        # The version is pinned to the one of .pre-commit-config.yaml, so
        # the hook and CI judge the same files with the same rules
        # (PUZ-REL-006).
        run: pip install "ruff==0.15.10"

      - name: Check Formatting & Lints
        run: |
          ruff check .
          ruff format --check .

  build-and-test:
    name: Test (${{ matrix.os }}, Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@v1.1
        with:
          version: 1.11.1

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential stockfish

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install stockfish || true

      - name: Install System Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install stockfish --no-progress || true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: >
          cmake -B build/cmake -S .
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DZEROPAWN_BUILD_PYTHON=ON
          -DZEROPAWN_BUILD_TESTS=ON

      - name: Build C++ Components
        run: cmake --build build/cmake --config Release -j 2

      - name: Run C++ Unit Tests (CTest)
        run: ctest --test-dir build/cmake --output-on-failure

      - name: Install Python Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: CLI Smoke Test
        run: |
          python cli.py --help
          python cli.py status

      - name: Run Python Pytest Suite
        run: |
          python -m pytest tests/ -k "not soak and not test_correctness_replay_200_games" -v --durations=10
